
<div style="padding: 0.5rem 0;">
<div style="display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
  <button id="m1" style="background: var(--color-text-primary); color: var(--color-background-primary); border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 500;">Bones (voting)</button>
  <button id="m2" style="padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">Flesh (voting)</button>
  <button id="m3" style="padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">Voted (locked)</button>
  <button id="m4" style="padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">Finale: Bass</button>
  <button id="m5" style="padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">Finale: FX</button>
</div>
<div style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
<div style="width: 280px;">
  <div style="background: #0a0a0a; border-radius: 28px; border: 2px solid #222; padding: 12px 14px 18px; min-height: 560px; position: relative; overflow: hidden;">
    <canvas id="pc" width="504" height="1060" style="width: 252px; height: 530px; display: block;"></canvas>
  </div>
</div>
</div>
</div>

<script>
const cv=document.getElementById('pc'),c=cv.getContext('2d'),W=cv.width,H=cv.height;

const AMBER={r:232,g:167,b:53},CORAL={r:224,g:96,b:112},TEAL={r:69,g:176,b:144};
const DIM={r:60,g:60,b:55},WHITE={r:255,g:255,b:255};
const CHAPS=[AMBER,CORAL,TEAL];
const CNAMES=['ambition','love','avoidance'];

function rgb(co,a){return`rgba(${Math.round(co.r)},${Math.round(co.g)},${Math.round(co.b)},${a||1})`;}
function smoothN(x,y,t){return Math.sin(x*1.7+t*0.8)*0.3+Math.sin(y*2.3+t*0.6)*0.3+Math.sin((x+y)*1.1+t*1.2)*0.2+Math.sin(x*3.1-t*0.4)*0.2;}

function drawMiniMemb(x,y,R,col,al,inten,t,off){
  const s=32;c.beginPath();
  for(let i=0;i<=s;i++){const a=(i/s)*Math.PI*2;const n=smoothN(Math.cos(a)*3,Math.sin(a)*3,t*1.2+off);const d=R*(1+n*inten);if(i===0)c.moveTo(x+Math.cos(a)*d,y+Math.sin(a)*d);else c.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);}
  c.closePath();c.fillStyle=rgb(col,al*.12);c.fill();c.strokeStyle=rgb(col,al*.4);c.lineWidth=1;c.stroke();
}

const NODES=[
  {id:'bass',sym:'■',angle:-Math.PI/2},
  {id:'drums',sym:'▲',angle:-Math.PI/2+2*Math.PI/5},
  {id:'pad',sym:'◆',angle:-Math.PI/2+4*Math.PI/5},
  {id:'harmony',sym:'●',angle:-Math.PI/2+6*Math.PI/5},
  {id:'fx',sym:'~',angle:-Math.PI/2+8*Math.PI/5}
];
const GROUPS={bones:['bass','drums'],flesh:['harmony','pad'],spark:['fx']};

const MODES={
  m1:{phase:'build',group:'bones',filled:[],chapter:0,voted:null,layerIdx:0},
  m2:{phase:'build',group:'flesh',filled:['bass','drums'],chapter:0,voted:null,layerIdx:1},
  m3:{phase:'build',group:'flesh',filled:['bass','drums'],chapter:0,voted:'A',layerIdx:1},
  m4:{phase:'finale',assignedType:'bass',assignedLabel:'THE GROUND',assignedSym:'■',
      fragments:[{song:0,chap:0,label:'Song 1 bass',votes:4,total:8},{song:1,chap:1,label:'Song 2 bass',votes:3,total:8},{song:2,chap:2,label:'Song 3 bass',votes:1,total:8}],
      selected:0,nodeColors:{bass:0,drums:1,pad:2,harmony:0,fx:1}},
  m5:{phase:'finale',assignedType:'fx',assignedLabel:'THE SHIMMER',assignedSym:'~',
      fragments:[{song:1,chap:1,label:'Song 2 fx',votes:5,total:7},{song:2,chap:2,label:'Song 3 fx',votes:2,total:7}],
      selected:0,nodeColors:{bass:0,drums:1,pad:2,harmony:0,fx:1}}
};

let cur='m1',audOpt='A',audTimer=0,audCycleDur=3000,totalAudDur=12000,audElapsed=0;

function drawMiniSkel(cx,cy,r,t,st){
  const nR=r*0.22;
  for(const n of NODES){const nx=cx+Math.cos(n.angle)*r,ny=cy+Math.sin(n.angle)*r;c.beginPath();c.moveTo(cx,cy);c.lineTo(nx,ny);c.strokeStyle='rgba(255,255,255,0.04)';c.lineWidth=0.5;c.stroke();}
  c.beginPath();c.arc(cx,cy,nR*1.2,0,Math.PI*2);
  const sCol=st.phase==='finale'?WHITE:CHAPS[st.chapter||0];
  c.fillStyle=rgb(sCol,0.12);c.fill();c.strokeStyle=rgb(sCol,0.3);c.lineWidth=1;c.stroke();
  c.font=`${Math.round(nR*1.8)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=rgb(sCol,0.5);c.fillText('✦',cx,cy);
  for(const n of NODES){const nx=cx+Math.cos(n.angle)*r,ny=cy+Math.sin(n.angle)*r;let col=DIM,al=0.25,hm=false;
    if(st.phase==='finale'){col=CHAPS[st.nodeColors[n.id]];al=0.9;hm=true;}
    else{const isA=st.group&&GROUPS[st.group]&&GROUPS[st.group].includes(n.id);const isF=st.filled&&st.filled.includes(n.id);if(isA){col=CHAPS[st.chapter];al=0.7+Math.sin(t*3)*0.2;hm=true;}else if(isF){col=CHAPS[st.chapter];al=0.75;hm=true;}}
    if(hm)drawMiniMemb(nx,ny,nR*1.4,col,al,0.08,t,NODES.indexOf(n)*2);
    c.beginPath();c.arc(nx,ny,nR,0,Math.PI*2);
    if(hm){c.fillStyle=rgb(col,0.08);c.fill();c.strokeStyle=rgb(col,al*0.6);c.lineWidth=1;c.stroke();}
    else{c.fillStyle='rgba(20,20,18,0.8)';c.fill();c.strokeStyle='rgba(50,50,45,0.4)';c.lineWidth=0.5;c.stroke();}
    c.font=`${Math.round(nR*1.3)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=rgb(col,al*0.8);c.fillText(n.sym,nx,ny);
  }
}

function drawBuild(t){
  const st=MODES[cur],col=CHAPS[st.chapter],isVoted=st.voted!==null,isA=audOpt==='A';

  c.font=`${Math.round(W*0.028)}px sans-serif`;c.textAlign='center';c.fillStyle='rgba(255,255,255,0.25)';
  c.fillText('LAYER '+(st.layerIdx+1)+' OF 3',W/2,36);
  const gL={bones:'BONES',flesh:'FLESH',spark:'SPARK'};
  c.font=`500 ${Math.round(W*0.045)}px sans-serif`;c.fillStyle=rgb(col,0.85);
  c.fillText(gL[st.group],W/2,72);

  drawMiniSkel(W/2,175,65,t,st);

  const cardTop=275,cardH=280,cardGap=14,padX=14;
  const cardW=(W-padX*2-cardGap)/2;
  const aX=padX,bX=padX+cardW+cardGap;
  const progBarH=8,progBarGap=8,progBarY=cardTop+cardH+progBarGap;

  // card A
  const aSel=st.voted==='A',aPlay=!isVoted&&isA;
  let aBg='rgba(255,255,255,0.015)',aBrd='rgba(255,255,255,0.06)',aBW=0.5,aLA=0.35,aSA=0.45;
  if(aSel){aBg=rgb(col,0.08);aBrd=rgb(col,0.7);aBW=2.5;aLA=0.5;aSA=0.9;}
  else if(aPlay){aBg=rgb(col,0.04);aBrd=rgb(col,0.45);aBW=1.5;aLA=0.4;aSA=0.7;}
  else if(isVoted){aBg='rgba(255,255,255,0.01)';aBrd='rgba(255,255,255,0.04)';aSA=0.12;aLA=0.06;}

  c.fillStyle=aBg;c.beginPath();c.roundRect(aX,cardTop,cardW,cardH,12);c.fill();
  c.strokeStyle=aBrd;c.lineWidth=aBW;c.stroke();

  if(aPlay){c.font=`${Math.round(W*0.022)}px sans-serif`;c.textAlign='center';c.fillStyle=rgb(col,0.4+Math.sin(t*2)*0.1);c.fillText('NOW PLAYING',aX+cardW/2,cardTop+24);}

  c.font=`500 ${Math.round(W*0.1)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=rgb(col,aSA);c.fillText('A',aX+cardW/2,cardTop+cardH*0.4);
  c.font=`500 ${Math.round(W*0.032)}px sans-serif`;c.fillStyle=rgb(col,aLA);c.fillText('PRIMAL',aX+cardW/2,cardTop+cardH*0.62);
  if(!isVoted){c.beginPath();c.arc(aX+cardW/2,cardTop+cardH*0.78,6,0,Math.PI*2);c.fillStyle=rgb(col,0.2);c.fill();}
  if(aSel){c.font=`${Math.round(W*0.028)}px sans-serif`;c.fillStyle=rgb(col,0.5);c.fillText('YOUR VOTE',aX+cardW/2,cardTop+cardH*0.85);}

  // card B
  const bSel=st.voted==='B',bPlay=!isVoted&&!isA;
  let bBg='rgba(255,255,255,0.015)',bBrd='rgba(255,255,255,0.06)',bBW=0.5,bLA=0.35,bSA=0.45;
  if(bSel){bBg=rgb(col,0.08);bBrd=rgb(col,0.7);bBW=2.5;bLA=0.5;bSA=0.9;}
  else if(bPlay){bBg=rgb(col,0.04);bBrd=rgb(col,0.45);bBW=1.5;bLA=0.4;bSA=0.7;}
  else if(isVoted){bBg='rgba(255,255,255,0.01)';bBrd='rgba(255,255,255,0.04)';bSA=0.12;bLA=0.06;}

  c.fillStyle=bBg;c.beginPath();c.roundRect(bX,cardTop,cardW,cardH,12);c.fill();
  c.strokeStyle=bBrd;c.lineWidth=bBW;c.stroke();

  if(bPlay){c.font=`${Math.round(W*0.022)}px sans-serif`;c.textAlign='center';c.fillStyle=rgb(col,0.4+Math.sin(t*2)*0.1);c.fillText('NOW PLAYING',bX+cardW/2,cardTop+24);}

  c.font=`500 ${Math.round(W*0.1)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=rgb(col,bSA);c.fillText('B',bX+cardW/2,cardTop+cardH*0.4);
  c.font=`500 ${Math.round(W*0.032)}px sans-serif`;c.fillStyle=rgb(col,bLA);c.fillText('SYNTHETIC',bX+cardW/2,cardTop+cardH*0.62);
  if(!isVoted){c.beginPath();c.arc(bX+cardW/2,cardTop+cardH*0.78,6,0,Math.PI*2);c.strokeStyle=rgb(col,0.2);c.lineWidth=1.5;c.stroke();}
  if(bSel){c.font=`${Math.round(W*0.028)}px sans-serif`;c.fillStyle=rgb(col,0.5);c.fillText('YOUR VOTE',bX+cardW/2,cardTop+cardH*0.85);}

  // progress bars (depleting)
  if(!isVoted){
    const playX=isA?aX:bX;
    const cycleRemaining=1-(audTimer/audCycleDur);

    // per-option bar: depletes as current option plays
    c.fillStyle='rgba(255,255,255,0.04)';
    c.beginPath();c.roundRect(playX+8,progBarY,cardW-16,progBarH,4);c.fill();
    c.fillStyle=rgb(col,0.3);
    c.beginPath();c.roundRect(playX+8,progBarY,(cardW-16)*cycleRemaining,progBarH,4);c.fill();

    // overall audition bar: depletes as total time runs out
    const totalProgY=progBarY+progBarH+14;
    const totalRemaining=1-Math.min(1,audElapsed/totalAudDur);

    c.fillStyle='rgba(255,255,255,0.03)';
    c.beginPath();c.roundRect(padX,totalProgY,W-padX*2,6,3);c.fill();
    c.fillStyle=rgb(col,0.15);
    c.beginPath();c.roundRect(padX,totalProgY,(W-padX*2)*totalRemaining,6,3);c.fill();

    c.font=`${Math.round(W*0.022)}px sans-serif`;c.textAlign='center';c.fillStyle='rgba(255,255,255,0.12)';
    const sLeft=Math.max(0,Math.round((totalAudDur-audElapsed)/1000));
    c.fillText(sLeft+'s remaining',W/2,totalProgY+22);

    const dotY=totalProgY+40,dotSp=40,dotSt=W/2-dotSp;
    for(let i=0;i<3;i++){const dx=dotSt+i*dotSp;const isF=i<st.layerIdx,isAc=i===st.layerIdx;
      c.beginPath();c.arc(dx,dotY,6,0,Math.PI*2);
      if(isF){c.fillStyle=rgb(col,0.6);c.fill();}
      else if(isAc){c.strokeStyle=rgb(col,0.6+Math.sin(t*2)*0.2);c.lineWidth=2;c.stroke();}
      else{c.strokeStyle='rgba(255,255,255,0.1)';c.lineWidth=1;c.stroke();}}
    c.font=`${Math.round(W*0.025)}px sans-serif`;c.fillStyle='rgba(255,255,255,0.15)';c.fillText('TAP TO VOTE',W/2,dotY+30);
  } else {
    const dotY=progBarY+10,dotSp=40,dotSt=W/2-dotSp;
    for(let i=0;i<3;i++){const dx=dotSt+i*dotSp;const isF=i<st.layerIdx,isAc=i===st.layerIdx;
      c.beginPath();c.arc(dx,dotY,6,0,Math.PI*2);
      if(isF){c.fillStyle=rgb(col,0.6);c.fill();}
      else if(isAc){c.strokeStyle=rgb(col,0.5);c.lineWidth=2;c.stroke();}
      else{c.strokeStyle='rgba(255,255,255,0.1)';c.lineWidth=1;c.stroke();}}
    c.font=`${Math.round(W*0.025)}px sans-serif`;c.textAlign='center';c.fillStyle='rgba(255,255,255,0.12)';c.fillText('VOTE LOCKED',W/2,dotY+30);
  }
}

function drawFinale(t){
  const st=MODES[cur],aCol=CHAPS[st.nodeColors[st.assignedType]];
  c.font=`${Math.round(W*0.025)}px sans-serif`;c.textAlign='center';c.fillStyle='rgba(255,255,255,0.2)';c.fillText('YOUR GROUP',W/2,30);
  c.font=`500 ${Math.round(W*0.07)}px sans-serif`;c.fillStyle=rgb(aCol,0.8);c.fillText(st.assignedSym,W/2,72);
  c.font=`500 ${Math.round(W*0.035)}px sans-serif`;c.fillStyle=rgb(aCol,0.5);c.fillText(st.assignedLabel,W/2,104);

  const cSY=140,cH=110,cG=10,cP=16;
  for(let i=0;i<st.fragments.length;i++){
    const f=st.fragments[i],col=CHAPS[f.chap],y=cSY+i*(cH+cG),isSel=i===st.selected,isMaj=f.votes>f.total/2;
    c.fillStyle=isSel?rgb(col,0.06):'rgba(255,255,255,0.015)';c.beginPath();c.roundRect(cP,y,W-cP*2,cH,10);c.fill();
    c.strokeStyle=isSel?rgb(col,0.6):'rgba(255,255,255,0.06)';c.lineWidth=isSel?2:0.5;c.stroke();
    c.beginPath();c.arc(cP+24,y+cH/2,8,0,Math.PI*2);c.fillStyle=rgb(col,0.7);c.fill();
    c.font=`500 ${Math.round(W*0.035)}px sans-serif`;c.textAlign='left';c.fillStyle=rgb(col,isSel?0.9:0.5);c.fillText(f.label,cP+44,y+34);
    c.font=`${Math.round(W*0.025)}px sans-serif`;c.fillStyle=rgb(col,0.3);c.fillText(CNAMES[f.chap],cP+44,y+56);
    const bX2=cP+44,bY2=y+70,bW2=W-cP*2-60,bH2=12;
    c.fillStyle='rgba(255,255,255,0.04)';c.beginPath();c.roundRect(bX2,bY2,bW2,bH2,6);c.fill();
    c.fillStyle=rgb(col,isMaj?0.4:0.15);c.beginPath();c.roundRect(bX2,bY2,bW2*(f.votes/f.total),bH2,6);c.fill();
    c.font=`500 ${Math.round(W*0.025)}px sans-serif`;c.textAlign='right';c.fillStyle=rgb(col,isMaj?0.7:0.3);c.fillText(f.votes+'/'+f.total,W-cP-8,y+38);
    if(isMaj){c.font=`${Math.round(W*0.02)}px sans-serif`;c.fillStyle=rgb(col,0.4);c.fillText('NOW PLAYING',W-cP-8,y+56);}
    if(isSel){c.beginPath();c.arc(W-cP-8,y+78,4,0,Math.PI*2);c.fillStyle=rgb(col,0.8);c.fill();c.font=`${Math.round(W*0.02)}px sans-serif`;c.textAlign='right';c.fillStyle=rgb(col,0.4);c.fillText('YOUR PICK',W-cP-18,y+82);}
  }
  const skY=cSY+st.fragments.length*(cH+cG)+50;
  drawMiniSkel(W/2,skY+20,50,t,st);
  c.font=`${Math.round(W*0.028)}px monospace`;c.textAlign='center';c.fillStyle='rgba(130,180,130,0.4)';
  c.fillText("Shape it. It's yours now.",W/2,skY+100);
}

function draw(time){
  const t=time*0.001,st=MODES[cur];
  if(st.phase==='build'&&!st.voted){audTimer+=16;audElapsed+=16;if(audTimer>=audCycleDur){audTimer=0;audOpt=audOpt==='A'?'B':'A';}if(audElapsed>=totalAudDur)audElapsed=0;}
  c.clearRect(0,0,W,H);c.fillStyle='#0a0a0a';c.fillRect(0,0,W,H);
  if(st.phase==='build')drawBuild(t);else drawFinale(t);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

cv.addEventListener('click',(e)=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H,st=MODES[cur];
  if(st.phase==='build'&&!st.voted){const cT=275,cH2=280,cG2=14,pX=14,cW2=(W-pX*2-cG2)/2;if(y>=cT&&y<=cT+cH2){if(x>=pX&&x<=pX+cW2)st.voted='A';else if(x>=pX+cW2+cG2&&x<=W-pX)st.voted='B';}}
  if(st.phase==='finale'){const cS=140,cH3=110,cG3=10,cP2=16;for(let i=0;i<st.fragments.length;i++){const fy=cS+i*(cH3+cG3);if(y>=fy&&y<=fy+cH3&&x>=cP2&&x<=W-cP2){const p=st.selected;if(p!==i){st.fragments[p].votes=Math.max(0,st.fragments[p].votes-1);st.fragments[i].votes++;st.selected=i;}break;}}}
});

const btns=['m1','m2','m3','m4','m5'];
for(const id of btns){document.getElementById(id).addEventListener('click',function(){
  cur=id;audTimer=0;audElapsed=0;audOpt='A';
  if(MODES[cur].phase==='build')MODES[cur].voted=null;
  if(id==='m4'){MODES.m4.fragments[0].votes=4;MODES.m4.fragments[1].votes=3;MODES.m4.fragments[2].votes=1;MODES.m4.selected=0;}
  if(id==='m5'){MODES.m5.fragments[0].votes=5;MODES.m5.fragments[1].votes=2;MODES.m5.selected=0;}
  for(const bid of btns){const b=document.getElementById(bid);if(bid===id){b.style.background='var(--color-text-primary)';b.style.color='var(--color-background-primary)';}else{b.style.background='';b.style.color='';}}
});}
</script>
